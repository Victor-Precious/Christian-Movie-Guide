# =========================================================
# CHRISTIAN MOVIE GUIDE — Netlify config
# This site is only used for the two Paystack functions —
# actual visitor traffic stays on Firebase Hosting. Netlify will
# still build/publish a copy of the static files, but nobody
# needs to visit the .netlify.app URL directly.
# =========================================================
[build]
  publish = "."
  functions = "netlify/functions"
